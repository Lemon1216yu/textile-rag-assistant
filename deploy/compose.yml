name: zhizhi

x-app: &app
  build:
    context: ..
  image: zhizhi-workspace:1.0.0
  env_file: secrets/app.env
  restart: unless-stopped
  volumes:
    - documents:/opt/zhizhi/data/enterprise-files
  networks: [backend]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp:size=128m,uid=10001,gid=10001
    - /opt/zhizhi/tmp:size=64m,uid=10001,gid=10001
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zhizhi
      MYSQL_USER: zhizhi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run prepare_deploy.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run prepare_deploy.py}
    volumes: [mysql:/var/lib/mysql]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u zhizhi -D zhizhi -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:?Run prepare_deploy.py}', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis:/data]
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 6
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    command: [etcd, --advertise-client-urls=http://etcd:2379, --listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
    volumes: [etcd:/etcd]
    networks: [backend]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 15s
      timeout: 5s
      retries: 10
  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    command: [minio, server, /data]
    environment:
      MINIO_ROOT_USER: zhizhi_storage
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run prepare_deploy.py}
    volumes: [minio:/data]
    networks: [backend]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 15s
      timeout: 5s
      retries: 10
  milvus:
    image: milvusdb/milvus:v2.6.14
    restart: unless-stopped
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: zhizhi_storage
      MINIO_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
    volumes:
      - milvus:/var/lib/milvus
      - ./secrets/milvus.yaml:/milvus/configs/user.yaml:ro
    networks: [backend]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 90s
  migrate:
    <<: *app
    restart: 'no'
    command: [python, -m, alembic, upgrade, head]
    healthcheck: {disable: true}
    depends_on:
      mysql: {condition: service_healthy}
  api:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
  worker:
    <<: *app
    command: [python, -m, enterprise.cli, worker]
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls:/etc/nginx/tls:ro
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}

networks:
  backend: {}
volumes:
  mysql: {}
  redis: {}
  etcd: {}
  minio: {}
  milvus: {}
  documents: {}
